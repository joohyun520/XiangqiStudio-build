name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract source
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "*.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath source -Force

      - name: Build EXE
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          Set-Location source/XiangqiStudio
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name XiangqiStudio app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: XiangqiStudio-Windows-EXE
          path: source/XiangqiStudio/dist/XiangqiStudio.exe
